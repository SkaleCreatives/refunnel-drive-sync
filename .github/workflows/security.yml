# Security gate (frontier0-hq policies/security-gate.md) via scripts/security-gate.sh: secrets, semgrep, dependencies.
#   pull request / push to main -> what the change introduces blocks (plus any high/critical dependency advisory)
#   Monday 05:17 UTC            -> full audit of repo + history; a failure opens or updates the issue "Security audit"
# Public repo: nothing deploys from here; users run ./start.sh locally.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Install gitleaks 8.30.1 (checksum pinned)
        run: |
          curl -sSfL -o /tmp/gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gl.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/gl.tgz -C /usr/local/bin gitleaks
      - name: Gate
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            schedule|workflow_dispatch) BASE=full ;;
            pull_request) BASE=$PR_BASE ;;
            *) BASE=${PUSH_BEFORE:-HEAD~1}; [[ "$BASE" =~ ^0+$ ]] && BASE=HEAD~1 ;;
          esac
          scripts/security-gate.sh "$BASE"

  report:
    needs: gate
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="Weekly security audit failed: $RUN (log of the gate job lists every finding)."
          n=$(gh issue list --state open --search 'in:title "Security audit"' --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "Security audit" --body "$body"; fi
